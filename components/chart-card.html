<!-- components/chart-card.html -->
<section class="chart-card">
  <header class="chart-head">
    <div>
      <h2 class="chart-title">Rural and urban population</h2>
      <p class="chart-subtitle">1990 - 2023</p>
    </div>
    <button class="chart-download" type="button" title="تنزيل الرسم" data-download>⬇️</button>
  </header>

  <div class="chart-body">
    <canvas id="popChart" height="140"></canvas>
  </div>

  <div id="chartLegend" class="chart-legend"></div>

  <footer id="chartMeta" class="chart-meta"></footer>
</section>
